name = "linkbeam-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Local development uses a throwaway local database, so this placeholder id is fine.
# Before deploying, create the real database (free, no card) and paste its id here:
#   pnpm exec wrangler d1 create linkbeam
[[d1_databases]]
binding = "DB"
database_name = "linkbeam"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

# Settings that differ per machine live in apps/api/.dev.vars (not committed). See .env.example.

# Daily cleanup of expired tokens, sessions and rate-limit rows (Cron Triggers: 5 free).
[triggers]
crons = ["17 3 * * *"]
