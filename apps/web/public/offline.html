<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <title>You are offline - Linkbeam</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/offline.css" />

<body>
  <main>
    <h1>You are offline</h1>
    <p>Linkbeam could not reach the internet, and this page was not saved on your device yet.</p>
    <p>Check your connection, then try again. Pages you have already opened, including your dashboard, still work.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
